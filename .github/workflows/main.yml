name: CI and CD

# main is this repository's equivalent of the exercise's master branch.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# The workflow only needs to read the repository contents.
permissions:
  contents: read

jobs:
  test-backend:
    # Local reusable workflows come from the same commit as this workflow.
    uses: ./.github/workflows/test-backend.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-push-docker-image:
    # Wait for both Maven tests and the SonarCloud quality gate to pass.
    # Without needs, publishing could run in parallel with failing tests.
    needs: test-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish-docker.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
